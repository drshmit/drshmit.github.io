<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="img/logo.png">
<meta name="theme-color" content="#16100c">
<meta property="og:title" content="Dr. Shmit — натуральная кожаная обувь">
<meta property="og:description" content="Мужские и женские модели из натуральной кожи. Москва, м. Филатов Луг · доставка по России.">
<meta property="og:image" content="https://drshmit.github.io/img/og-banner.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://drshmit.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dr. Shmit">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<title>Dr. Shmit Shoes</title>
<meta name="description" content="Dr. Shmit — натуральная кожаная обувь из Ирана. Москва, м. Филатов Луг.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an atelier ledger — dark leather ground, gold stitch lines dividing sections, light "photo plates" for each pair. */
:root{
  --bg:#f2eee8; --surface:#fbf9f5; --plate:#e9e5df; --fg:#24190f; --muted:#6f6253; --line:#d9cfc1;
  --gold:#8f6c33; --gold-soft:#b8955c; --ink-on-gold:#fffaf1; --shadow:0 18px 40px -24px rgba(43,29,22,.45);
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16100c; --surface:#1f1712; --plate:#ebe7e1; --fg:#f0e4d0; --muted:#b2a189; --line:#3a2c22;
    --gold:#c9a46a; --gold-soft:#9c7c4b; --ink-on-gold:#1c130d; --shadow:0 22px 50px -26px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16100c; --surface:#1f1712; --plate:#ebe7e1; --fg:#f0e4d0; --muted:#b2a189; --line:#3a2c22;
  --gold:#c9a46a; --gold-soft:#9c7c4b; --ink-on-gold:#1c130d; --shadow:0 22px 50px -26px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.08;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* stitch line — the brand's recurring detail */
.stitch{height:2px;background-image:linear-gradient(90deg,var(--gold-soft) 60%,transparent 0);background-size:14px 2px;opacity:.7}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:50%}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.01em}
nav.menu{display:flex;gap:22px;margin-left:auto}
nav.menu a{text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);transition:color .2s}
nav.menu a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--mono);padding:7px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink-on-gold)}
.burger{display:none;margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:42px;height:38px;cursor:pointer;font-size:18px}
@media (max-width:820px){
  nav.menu{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  nav.menu.open{display:flex}
  nav.menu a{padding:12px 0;font-size:16px;color:var(--fg);border-bottom:1px dashed var(--line)}
  .burger{display:block}
  .lang{margin-left:0}
}

/* hero */
.hero{padding-block:56px 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,78px);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold);font-weight:500}
.hero p.lead{font-size:18px;max-width:46ch;color:var(--muted);margin:22px 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--gold);cursor:pointer;transition:transform .2s, background .2s, color .2s}
.btn.primary{background:var(--gold);color:var(--ink-on-gold)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn:hover{transform:translateY(-2px)}
.hero-art{position:relative;aspect-ratio:1/1;max-width:100%}
.hero-art .plate{position:absolute;border-radius:var(--r);overflow:hidden;background:var(--plate);box-shadow:var(--shadow)}
.hero-art .p1{inset:0 18% 22% 0}
.hero-art .p2{inset:46% 0 0 34%}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.hero-art svg{position:absolute;inset:-4% -4% auto auto;width:62%;pointer-events:none}
.seal{position:absolute;left:-10px;bottom:6%;width:104px;height:104px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;text-align:center;font:600 11px/1.3 var(--mono);color:var(--gold);box-shadow:var(--shadow)}
.route{display:flex;align-items:center;gap:10px;margin-top:26px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.route i{flex:0 0 60px;height:2px;background-image:linear-gradient(90deg,var(--gold-soft) 60%,transparent 0);background-size:10px 2px}
@media (max-width:860px){ .hero{grid-template-columns:1fr;gap:30px;padding-block:32px 24px} .hero-art{max-width:520px} }

/* trust strip */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-block:1px solid var(--line);margin-block:10px 0}
.facts div{padding:20px 18px;display:flex;flex-direction:column;gap:4px;border-right:1px dashed var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts b{font-family:var(--display);font-size:20px}
.facts span{font-size:13px;color:var(--muted)}
@media (max-width:760px){ .facts{grid-template-columns:1fr 1fr} .facts div:nth-child(2){border-right:0} .facts div:nth-child(-n+2){border-bottom:1px dashed var(--line)} }

section{padding-block:72px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:18px;margin-bottom:28px}
.sec-head h2{font-size:clamp(30px,4.2vw,48px);margin-top:8px}

/* filter */
.filter{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.filter button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 16px;border-radius:999px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* catalogue */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .grid{grid-template-columns:1fr} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;text-align:left;color:inherit;font:inherit;padding:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card .ph{position:relative;aspect-ratio:4/3;background:var(--plate);overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s, transform .8s cubic-bezier(.2,.7,.2,1)}
.card .ph img.alt{opacity:0}
.card:hover .ph img.alt{opacity:1}
.card:hover .ph img{transform:scale(1.04)}
.code{position:absolute;top:12px;left:12px;font:500 11px var(--mono);letter-spacing:.1em;background:rgba(28,19,13,.82);color:#f0e4d0;padding:5px 8px;border-radius:6px}
.card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11px var(--mono);letter-spacing:.06em;border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:999px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.price{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.more{font-weight:700;font-size:14px;color:var(--gold)}

/* reveal: visible at rest, gently animated when JS supports it */
.reveal{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:.001}to{transform:none;opacity:1}}

/* size helper */
.size{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:start}
@media (max-width:860px){ .size{grid-template-columns:1fr} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink-on-gold)}
label.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.foot-row{display:flex;align-items:center;gap:14px}
input[type=range]{flex:1;accent-color:var(--gold);min-width:0}
.cm{font:500 22px var(--mono);min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.result{margin-top:22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.result .big{font-family:var(--display);font-size:64px;line-height:1;color:var(--gold)}
.ruler{margin-top:18px;height:26px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 50px);background-size:auto 10px,auto 18px;background-repeat:repeat-x;background-position:0 100%,0 100%;opacity:.8}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px dashed var(--line);text-align:left;white-space:nowrap}
th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr.hit td{background:color-mix(in srgb,var(--gold) 18%,transparent);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
@media (max-width:900px){ .steps{grid-template-columns:1fr 1fr} }
@media (max-width:520px){ .steps{grid-template-columns:1fr} }
.step{border-top:2px solid var(--gold);padding-top:16px;min-width:0}
.step::before{counter-increment:s;content:"0" counter(s);font:500 12px var(--mono);color:var(--gold);letter-spacing:.12em}
.step h3{font-size:21px;margin:10px 0 8px}
.step p{margin:0;color:var(--muted);font-size:15px}

/* contacts */
.contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){ .contacts{grid-template-columns:1fr 1fr} }
@media (max-width:520px){ .contacts{grid-template-columns:1fr} }
.ct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0;transition:border-color .2s, transform .2s}
a.ct:hover{border-color:var(--gold);transform:translateY(-2px)}
.ct .k{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.ct .v{font-family:var(--display);font-size:22px;overflow-wrap:anywhere}
.ct .d{font-size:14px;color:var(--muted)}
.copy{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:6px 12px;font:600 12px var(--body);cursor:pointer}

footer{padding-block:34px 44px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}

/* product dialog */
dialog{border:0;padding:0;border-radius:18px;max-width:min(980px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--fg);box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(14,9,6,.62);backdrop-filter:blur(3px)}
.dlg{display:grid;grid-template-columns:1.15fr 1fr;max-height:min(88vh,760px)}
@media (max-width:760px){ .dlg{grid-template-columns:1fr;max-height:88vh;overflow:auto} }
.gal{background:var(--plate);position:relative;display:flex;flex-direction:column;min-width:0}
.gal .main{position:relative;aspect-ratio:4/3;overflow:hidden}
.gal .main img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:0 0 64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none}
.thumbs button[aria-current="true"]{border-color:#8f6c33}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#24190f;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.nav-arrow.l{left:10px}.nav-arrow.r{right:10px}
.info{padding:26px 26px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.info h3{font-size:30px}
.info ul{margin:0;padding-left:18px;color:var(--muted)}
.info li{margin:4px 0}
.chip.tg{border-color:var(--gold-soft);color:var(--gold)}
.btn[hidden],.nav-arrow[hidden]{display:none}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes span{font:500 13px var(--mono);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.close{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(28,19,13,.82);color:#f0e4d0;font-size:18px;cursor:pointer}
.info .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:8px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>


<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Dr. Shmit"><img src="img/logo.png" alt=""><b>Dr. Shmit</b></a>
    <nav class="menu" id="menu">
      <a href="#catalog" data-i="nav_cat"></a>
      <a href="#catalog" data-filter-link="men" data-i="nav_men"></a>
      <a href="#catalog" data-filter-link="women" data-i="nav_women"></a>
      <a href="#size" data-i="nav_size"></a>
      <a href="#order" data-i="nav_order"></a>
      <a href="#contacts" data-i="nav_contacts"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <div class="hero">
      <div class="reveal">
        <div class="eyebrow" data-i="hero_eyebrow"></div>
        <h1 style="margin-top:14px" data-i-html="hero_title"></h1>
        <p class="lead" data-i="hero_lead"></p>
        <div class="cta">
          <a class="btn primary" href="#catalog" data-i="hero_cta1"></a>
          <a class="btn ghost" href="https://t.me/drshmit_msk" target="_blank" rel="noopener" data-i="hero_cta2"></a>
        </div>
        <div class="route"><span data-i="route_from"></span><i></i><span data-i="route_to"></span><span>·</span><span data-i="route_days"></span></div>
      </div>
      <div class="hero-art reveal" style="animation-delay:.12s">
        <div class="plate p1"><img src="img/m01_01_cover.jpg" alt="Dr. Shmit chelsea boots M01"></div>
        <div class="plate p2"><img src="img/w12_01_cover.jpg" alt="Dr. Shmit quilted ankle boots W12"></div>
        <svg viewBox="0 0 300 160" aria-hidden="true"><path id="thread" d="M6 140 C 70 40, 150 150, 210 60 S 290 30, 296 8" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 7"/></svg>
        <div class="seal"><span data-i-html="seal"></span></div>
      </div>
    </div>
    <div class="facts reveal" style="animation-delay:.2s">
      <div><b data-i="f1b"></b><span data-i="f1s"></span></div>
      <div><b data-i="f2b"></b><span data-i="f2s"></span></div>
      <div><b data-i="f3b"></b><span data-i="f3s"></span></div>
      <div><b>5,0 ★</b><span data-i="f4s"></span></div>
    </div>
  </div>

  <section id="catalog">
    <div class="wrap">
      <div class="sec-head">
        <div><div class="eyebrow" data-i="cat_eyebrow"></div><h2 data-i="cat_title"></h2></div>
        <div class="filter" role="group" aria-label="Filter">
          <button type="button" id="f-all" data-f="all" aria-pressed="true" data-i="f_all"></button>
          <button type="button" id="f-men" data-f="men" aria-pressed="false" data-i="f_men"></button>
          <button type="button" id="f-women" data-f="women" aria-pressed="false" data-i="f_women"></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="wrap"><div class="stitch"></div></div>

  <section id="size">
    <div class="wrap">
      <div class="sec-head"><div><div class="eyebrow" data-i="size_eyebrow"></div><h2 data-i="size_title"></h2></div></div>
      <div class="size">
        <div class="panel">
          <div class="seg" role="group" aria-label="Gender">
            <button type="button" id="g-men" data-g="men" aria-pressed="true" data-i="f_men"></button>
            <button type="button" id="g-women" data-g="women" aria-pressed="false" data-i="f_women"></button>
          </div>
          <label class="lbl" for="foot" data-i="size_label"></label>
          <div class="foot-row"><input type="range" id="foot" min="22" max="30" step="0.1" value="27.5"><span class="cm" id="cm">27.5 cm</span></div>
          <div class="ruler" aria-hidden="true"></div>
          <div class="result"><span class="muted" data-i="size_res"></span><span class="big" id="res">43</span><span class="muted" id="resnote"></span></div>
          <p class="note" data-i="size_how"></p>
        </div>
        <div class="panel tablebox">
          <table aria-label="Size chart">
            <thead><tr><th data-i="t_ru"></th><th data-i="t_eu"></th><th data-i="t_cm"></th></tr></thead>
            <tbody id="chart"></tbody>
          </table>
          <p class="note" data-i="size_note"></p>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap"><div class="stitch"></div></div>

  <section id="order">
    <div class="wrap">
      <div class="sec-head"><div><div class="eyebrow" data-i="order_eyebrow"></div><h2 data-i="order_title"></h2></div></div>
      <div class="steps">

      <div class="chips">${L.s.map(s=>`<span class="chip">${s}</span>`).join("")}<span class="chip">${p.sizes[0]}–${p.sizes[p.sizes.length-1]}</span>${p.avito?"":`<span class="chip tg">${T[lang].tgonly}</span>`}</div>
      <div class="row"><span class="price">${rub(p.price)}</span><span class="more">${T[lang].more}</span></div></div>`;
    b.addEventListener("click",()=>openP(p,0));
    g.appendChild(b);
  });
}
function openP(p,i,keep){
  cur=p; idx=i||0; const L=p[lang];
  $("#d-code").textContent=p.code+" · "+T[lang][p.g];
  $("#d-title").textContent=L.n;
  $("#d-chips").innerHTML=L.s.map(s=>`<span class="chip">${s}</span>`).join("");
  $("#d-feat").innerHTML=L.f.map(f=>`<li>${f}</li>`).join("");
  $("#d-sizes").innerHTML=p.sizes.map(s=>`<span>${s}</span>`).join("");
  $("#d-price").textContent=rub(p.price);
  $("#d-prev").hidden=$("#d-next").hidden=p.img.length<2;
  $("#d-avito").href=p.avito||"#"; $("#d-avito").hidden=!p.avito;
  $("#d-tg").href="https://t.me/drshmit_msk?text="+encodeURIComponent(T[lang].tgmsg+p.code+" — "+L.n);
  $("#d-thumbs").innerHTML=p.img.map((im,k)=>`<button type="button" aria-label="Photo ${k+1}" data-k="${k}"><img src="img/${im}.jpg" alt=""></button>`).join("");
  $$("#d-thumbs button").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.k)));
  show(idx);
  const d=$("#dlg"); if(!d.open){ if(d.showModal) d.showModal(); else d.setAttribute("open",""); }
}
function show(k){
  const n=cur.img.length; idx=(k+n)%n;
  const img=$("#d-img"); img.style.animation="none"; img.offsetHeight; img.style.animation="";
  img.src=`img/${cur.img[idx]}.jpg`; img.alt=cur[lang].n;
  $$("#d-thumbs button").forEach((b,j)=>b.setAttribute("aria-current",String(j===idx)));
}
function closeD(){ const d=$("#dlg"); if(d.close) d.close(); else d.removeAttribute("open"); cur=null; }
function renderChart(){
  $("#chart").innerHTML=CHART[gender].map(r=>`<tr data-ru="${r[0]}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toFixed(1)}</td></tr>`).join("");
}
function calc(){
  const v=+$("#foot").value; $("#cm").textContent=v.toFixed(1)+" cm";
  const rows=CHART[gender]; let hit=rows.find(r=>v<=r[2]); let note="";
  if(!hit){ hit=rows[rows.length-1]; note=T[lang].out; }
  else { const prev=rows[rows.indexOf(hit)-1]; if(prev && v>prev[2] && v<hit[2]-0.2) note=T[lang].between; if(v<rows[0][2]-1) note=T[lang].out; }
  $("#res").textContent=hit[0]; $("#resnote").textContent=note;
  $$("#chart tr").forEach(tr=>tr.classList.toggle("hit",+tr.dataset.ru===hit[0]));
}
function setFilter(f){ filter=f; $$(".filter button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===f))); renderGrid(); }

$$(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang; try{localStorage.setItem("drs-lang",lang);}catch(e){} applyLang();}));

$$("[data-filter-link]").forEach(a=>a.addEventListener("click",()=>{setFilter(a.dataset.filterLink); $("#menu").classList.remove("open");}));
$$(".seg button").forEach(b=>b.addEventListener("click",()=>{gender=b.dataset.g; $$(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); $("#foot").value=gender==="men"?27.5:24.5; renderChart(); calc();}));
$("#foot").addEventListener("input",calc);
$("#burger").addEventListener("click",()=>{const m=$("#menu"); m.classList.toggle("open"); $("#burger").setAttribute("aria-expanded",String(m.classList.contains("open")));});
$$("#menu a").forEach(a=>a.addEventListener("click",()=>$("#menu").classList.remove("open")));
$("#d-close").addEventListener("click",closeD);
$("#d-prev").addEventListener("click",()=>show(idx-1));
$("#d-next").addEventListener("click",()=>show(idx+1));
$("#dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") closeD(); });
$("#dlg").addEventListener("close",()=>{cur=null;});
document.addEventListener("keydown",e=>{ if(!cur) return; if(e.key==="ArrowRight") show(idx+1); if(e.key==="ArrowLeft") show(idx-1); });
let tx=null; $(".gal .main").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
$(".gal .main").addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) show(idx+(dx<0?1:-1)); tx=null; });
$("#copy-phone").addEventListener("click",async()=>{
  const btn=$("#copy-phone"), txt=$("#phone").textContent;
  try{ await navigator.clipboard.writeText(txt); btn.textContent=T[lang].copied; setTimeout(()=>btn.textContent=T[lang].copy,1600); }
  catch(e){ const r=document.createRange(); r.selectNodeContents($("#phone")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
});
